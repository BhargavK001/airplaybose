name: airplaybose
description: "A Flutter project for AirPlay Bose on Android."
publish_to: 'none' # Prevent accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # jmdns: keep this note - this is android native, skip for dart side
  permission_handler: ^11.0.1
  network_info_plus: ^4.1.0
  just_audio: ^0.9.36
  audio_session: ^0.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
